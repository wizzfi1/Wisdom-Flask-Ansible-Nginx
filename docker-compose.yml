version: '3.8'
services:
  wisdom:
    image: wizfi/wisdom-flask
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - grafana  # Optional dependency

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_DOMAIN=wizfi-grafana.duckdns.org
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://wizfi-grafana.duckdns.org
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana_data: