global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["{{ ansible_host }}:9100"]

  - job_name: "flask_app"
    static_configs:
      - targets: ["{{ flask_host }}:{{ flask_metrics_port }}"]
    